# Coverage is visible for review; deterministic CI is the merge gate.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
comment: false

ignore:
  - "testdata"
  - "**/*_test.go"
